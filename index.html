<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>物理治療部 新症約期間卷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;
  background:#1e3d59;
  color:#fff;
  overflow-x:hidden;
}

/* ── Speech unlock overlay ── */
#speech-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.88);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:1000;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#speech-overlay .tap-icon{
  font-size:6rem;margin-bottom:1.5rem;
  animation:pulse 1.4s ease-in-out infinite;
}
#speech-overlay .tap-text{font-size:2.8rem;font-weight:bold;}
#speech-overlay .tap-sub{font-size:1.3rem;margin-top:.8rem;opacity:.7;}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.18);opacity:.65}
}

/* ── No-speech banner ── */
#no-speech-banner{
  display:none;position:fixed;top:0;left:0;right:0;
  background:#e74c3c;color:#fff;text-align:center;
  padding:.7rem;font-size:1.2rem;z-index:500;
}

/* ── App container ── */
#app{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:1rem .7rem 2rem;
}

/* ── Header ── */
.header-title{font-size:1.8rem;font-weight:bold;text-align:center;margin-top:.4rem;}
.header-sub{font-size:1.1rem;text-align:center;opacity:.75;margin-top:.2rem;margin-bottom:.8rem;}

/* ── Intro Screen ── */
#intro-screen{
  display:none;width:100%;max-width:700px;
  flex-direction:column;align-items:center;
}
.intro-card{
  background:#fff;color:#333;border-radius:16px;
  padding:2rem 1.4rem;text-align:left;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.5rem;width:100%;
}
.intro-title{color:#1368ce;font-size:1.5rem;font-weight:bold;margin-bottom:.8rem;}
.intro-text{font-size:1.2rem;line-height:1.6;margin-bottom:1.2rem;}
.intro-list{font-size:1.2rem;line-height:1.6;padding-left:1.5rem;}
.intro-list li{margin-bottom:0.6rem;}

/* Flashing Start Button */
@keyframes flashBtn {
  0% { box-shadow: 0 0 0 0 rgba(23, 185, 120, 0.7); transform: scale(1); }
  50% { box-shadow: 0 0 0 20px rgba(23, 185, 120, 0); transform: scale(1.05); }
  100% { box-shadow: 0 0 0 0 rgba(23, 185, 120, 0); transform: scale(1); }
}
#start-btn{
  padding:1.4rem 3.5rem;background:#17b978;color:#fff;
  border:none;border-radius:30px;font-size:2rem;font-weight:bold;
  cursor:pointer;
  transition:background .2s;
  margin-top: 20px;
  animation: flashBtn 1.8s infinite;
}
#start-btn:hover{background:#129661; animation: none; transform: scale(1.02);}

/* ── Progress ── */
#quiz-area{display:none;width:100%;flex-direction:column;align-items:center;}
#progress-area{width:100%;max-width:700px;margin-bottom:1rem;}
#progress-text{font-size:1.6rem;font-weight:bold;text-align:center;margin-bottom:.5rem;}
#progress-bar-bg{width:100%;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;}
#progress-bar-fill{height:100%;width:0;background:#17b978;border-radius:6px;transition:width .4s ease;}

/* ── Question card ── */
#question-card{
  background:#fff;color:#222;border-radius:16px;
  padding:1.6rem 1.2rem 1rem;
  width:100%;max-width:700px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.2rem;
}
#question-number{font-size:1.2rem;color:#999;margin-bottom:.35rem;font-weight:bold;}
#question-text{
  font-size:1.8rem;
  font-weight:bold;
  line-height:1.5;
  white-space: pre-wrap;
}

/* ── Button row ── */
.btn-row{
  display:flex;justify-content:center;gap:.6rem;margin-top:1rem;flex-wrap:wrap;
}
.card-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.6rem 1.8rem;
  background:#ececec;color:#555;border:none;border-radius:25px;
  font-size:1.3rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.card-btn:hover{background:#ddd;}
#prev-btn{display:none;background:#dfe6e9;color:#2d3436;}
#prev-btn:hover{background:#b2bec3;}

/* ── Answers area ── */
#answers-area{
  width:100%;max-width:700px;
  display:grid;grid-template-columns:1fr;gap:.75rem;
}
#sub-area{
  width:100%;max-width:700px;
  display:none;
}

/* ── Answer buttons ── */
