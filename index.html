<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>物理治療部 新症約期間卷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;
  background:#1e3d59;
  color:#fff;
  overflow-x:hidden;
}

/* ── Speech unlock overlay ── */
#speech-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.88);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:1000;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#speech-overlay .tap-icon{
  font-size:6rem;margin-bottom:1.5rem;
  animation:pulse 1.4s ease-in-out infinite;
}
#speech-overlay .tap-text{font-size:2.8rem;font-weight:bold;}
#speech-overlay .tap-sub{font-size:1.3rem;margin-top:.8rem;opacity:.7;}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.18);opacity:.65}
}

/* ── No-speech banner ── */
#no-speech-banner{
  display:none;position:fixed;top:0;left:0;right:0;
  background:#e74c3c;color:#fff;text-align:center;
  padding:.7rem;font-size:1.2rem;z-index:500;
}

/* ── App container ── */
#app{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:1rem .7rem 2rem;
}

/* ── Header ── */
.header-title{font-size:1.8rem;font-weight:bold;text-align:center;margin-top:.4rem;}
.header-sub{font-size:1.1rem;text-align:center;opacity:.75;margin-top:.2rem;margin-bottom:.8rem;}

/* ── Intro Screen ── */
#intro-screen{
  display:none;width:100%;max-width:700px;
  flex-direction:column;align-items:center;
}
.intro-card{
  background:#fff;color:#333;border-radius:16px;
  padding:2rem 1.4rem;text-align:left;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.5rem;width:100%;
}
.intro-title{color:#1368ce;font-size:1.5rem;font-weight:bold;margin-bottom:.8rem;}
.intro-text{font-size:1.2rem;line-height:1.6;margin-bottom:1.2rem;}
.intro-list{font-size:1.2rem;line-height:1.6;padding-left:1.5rem;}
.intro-list li{margin-bottom:0.6rem;}
#start-btn{
  padding:1.2rem 3rem;background:#17b978;color:#fff;
  border:none;border-radius:30px;font-size:1.8rem;font-weight:bold;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
  margin-top: 10px;
}
#start-btn:hover{background:#129661;}

/* ── Progress ── */
#quiz-area{display:none;width:100%;flex-direction:column;align-items:center;}
#progress-area{width:100%;max-width:700px;margin-bottom:1rem;}
#progress-text{font-size:1.6rem;font-weight:bold;text-align:center;margin-bottom:.5rem;}
#progress-bar-bg{width:100%;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;}
#progress-bar-fill{height:100%;width:0;background:#17b978;border-radius:6px;transition:width .4s ease;}

/* ── Question card ── */
#question-card{
  background:#fff;color:#222;border-radius:16px;
  padding:1.6rem 1.2rem 1rem;
  width:100%;max-width:700px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.2rem;
}
#question-number{font-size:1.2rem;color:#999;margin-bottom:.35rem;font-weight:bold;}
#question-text{font-size:1.8rem;font-weight:bold;line-height:1.5;}

/* ── Button row ── */
.btn-row{
  display:flex;justify-content:center;gap:.6rem;margin-top:1rem;flex-wrap:wrap;
}
.card-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.6rem 1.8rem;
  background:#ececec;color:#555;border:none;border-radius:25px;
  font-size:1.3rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.card-btn:hover{background:#ddd;}
.card-btn.active{background:#ffeaa7;color:#856404;}
#prev-btn{display:none;background:#dfe6e9;color:#2d3436;}
#prev-btn:hover{background:#b2bec3;}

/* ── Explanation panel (question level) ── */
#explanation-panel{
  display:none;
  background:#fff9e6;border:2px solid #f0d060;border-radius:12px;
  padding:1.2rem 1rem;margin-top:1rem;text-align:left;
  animation:fadeSlideDown .3s ease;
}
@keyframes fadeSlideDown{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}
.explain-text{font-size:1.4rem;line-height:1.6;color:#333;}
.explain-listen-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  margin-top:.8rem;padding:.4rem 1.2rem;
  background:#f0d060;color:#6b5900;border:none;border-radius:20px;
  font-size:1.1rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.explain-listen-btn:hover{background:#e6c340;}

/* ── Answers area ── */
#answers-area{
  width:100%;max-width:700px;
  display:grid;grid-template-columns:1fr;gap:.75rem;
}

/* ── Answer buttons ── */
.answer-btn{
  border:none;border-radius:14px;
  padding:1.5rem 1rem;
  font-size:1.6rem;font-weight:bold;
  color:#fff;cursor:pointer;
  transition:transform .15s,opacity .15s,box-shadow .3s,filter .3s;
  box-shadow:0 5px 0 rgba(0,0,0,.22);
  text-align:center;user-select:none;
  -webkit-tap-highlight-color:transparent;
  min-height:4.5rem;
  display:flex;align-items:center;justify-content:center;
  gap:0.5rem;position:relative;
}
.answer-btn:active:not(.locked){transform:scale(.96);}
.answer-btn.locked{pointer-events:none;opacity:.35;filter:grayscale(.3);}
.answer-btn.selected{
  transform:scale(1.04);opacity:1!important;filter:none!important;
  box-shadow:0 0 0 5px #fff,0 5px 0 rgba(0,0,0,.22);
}

.answer-btn.glow{
  animation:glowPulse .7s ease-in-out infinite alternate;
  z-index:10;transform:scale(1.04);
}
@keyframes glowPulse{
  0%{
    box-shadow:0 0 12px rgba(255,255,255,0.6),0 0 24px rgba(255,255,255,0.3),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.15);
  }
  100%{
    box-shadow:0 0 24px rgba(255,255,255,1),0 0 48px rgba(255,255,255,0.5),0 0 72px rgba(255,255,255,0.2),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.35);
  }
}

.clr-red{background:#e74c3c;}
.clr-orange{background:#e67e22;}
.clr-yellow{background:#f1c40f; color:#222;}
.clr-green{background:#26ad60;}
.clr-blue{background:#1368ce;}
.btn-emoji{font-size:2.4rem;line-height:1;}

/* ── Result screen ── */
#result-screen{display:none;width:100%;max-width:700px;text-align:center;}
.result-card{
  background:#fff;color:#333;border-radius:16px;
  padding:2rem 1.4rem;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.5rem;
}
.result-msg{font-size:1.6rem;line-height:1.9;margin-bottom:1.8rem;text-align:left;}
.result-scores{font-size:2rem;font-weight:bold;color:#1e3d59;text-align:left;line-height:1.6;}
.result-scores span{display:inline-block;}
.result-credit{font-size:1rem;color:#aaa;margin-top:1.4rem;}
#restart-btn{
  padding:1.2rem 3rem;background:#17b978;color:#fff;
  border:none;border-radius:30px;font-size:1.8rem;font-weight:bold;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
#restart-btn:hover{background:#129661;}

@media(min-width:600px){
  #question-text{font-size:2.2rem;}
  .answer-btn{font-size:2rem;padding:1.8rem 1.2rem;}
  .btn-emoji{font-size:2.8rem;}
  .result-msg{font-size:1.8rem;}
  .explain-text{font-size:1.6rem;}
}
</style>
</head>
<body>

<div id="speech-overlay">
  <div class="tap-icon">🔊</div>
  <div class="tap-text">點按以啟用語音</div>
  <div class="tap-sub">Tap to enable voice</div>
</div>

<div id="no-speech-banner">此瀏覽器不支援語音朗讀</div>

<div id="app">
  <div class="header-title">新症約期間卷 (Triage)</div>
  <div class="header-sub">新界東醫院聯網 物理治療部</div>

  <div id="intro-screen">
    <div class="intro-card">
      <div class="intro-title">病人須知：</div>
      <div class="intro-text">此問卷將會協助我們了解您的最新狀況及分流，請如實回答下列問題。</div>
      <div class="intro-title" style="margin-top:15px; font-size:1.3rem;">說明：</div>
      <ul class="intro-list">
        <li>這份問卷共有 11 題。</li>
        <li>請根據您<strong>最近的情況</strong>，選擇最適合的答案。</li>
        <li>請仔細聆聽每條問題及口語解釋，並作答。</li>
      </ul>
    </div>
    <button id="start-btn">開始做問卷</button>
  </div>

  <div id="quiz-area">
    <div id="progress-area">
      <div id="progress-text"></div>
      <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    </div>
    <div id="question-card">
      <div id="question-number"></div>
      <div id="question-text"></div>
      <div class="btn-row">
        <button class="card-btn" id="prev-btn">⬅️ 返回上一題</button>
        <button class="card-btn" id="replay-btn">🔊 重播</button>
        <button class="card-btn" id="explain-btn">💡 聽解釋</button>
      </div>
      <div id="explanation-panel">
        <div class="explain-text" id="explain-text"></div>
        <button class="explain-listen-btn" id="explain-listen-btn">🔊 再聽一次解釋</button>
      </div>
    </div>
    <div id="answers-area"></div>
  </div>

  <div id="result-screen">
    <div class="result-card">
      <div class="result-msg" id="result-msg">非常感謝您完成了這份調查。請將結果交回物理治療部接待處。</div>
      <div class="result-scores" id="result-scores"></div>
      <div class="result-credit">新界東醫院聯網 物理治療部製作</div>
    </div>
    <button id="restart-btn">🔄 重新開始</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ═══════════════════ DATA (Triage 11 Questions) ═══════════════════ */
  var questions = [
    {
      id: 1, text: '我選擇物理治療的時間：', explanation: '請問你想約邊個時間做物理治療？',
      options: [
        { label: '任何時間', emoji: '🕒', val: '任何時間', color: 'clr-blue' },
        { label: '上午 (8:45-12:30)', emoji: '🌅', val: '上午', color: 'clr-yellow' },
        { label: '下午 (1:30-5:15)', emoji: '🌇', val: '下午', color: 'clr-orange' }
      ]
    },
    {
      id: 2, text: '請問你體內有沒有植入受磁波影響儀器或任何電子儀器？', explanation: '請問你身體入面有冇裝到一啲會受磁場影響嘅電子儀器，例如心臟起搏器？',
      options: [
        { label: '有', emoji: '✔️', val: '有', color: 'clr-red' },
        { label: '沒有', emoji: '❌', val: '沒有', color: 'clr-blue' }
      ]
    },
    {
      id: 3, text: '你有否因轉介書內的病情而曾接受公立醫院物理治療 (6個月內)？', explanation: '過去六個月內，你有冇因為今次轉介信上面嘅同一個病，去過政府醫院睇物理治療？',
      options: [
        { label: '有', emoji: '✔️', val: 1, color: 'clr-red' },
        { label: '沒有', emoji: '❌', val: 0, color: 'clr-blue' }
      ]
    },
    {
      id: 4, text: '最近3個月內你是否因轉介書內的病情而需住院接受治療？', explanation: '過去三個月內，你有冇因為今次轉介信上面嘅病，而需要入院留醫？',
      options: [
        { label: '有', emoji: '✔️', val: 1, color: 'clr-red' },
        { label: '沒有', emoji: '❌', val: 0, color: 'clr-blue' }
      ]
    },
    {
      id: 5, text: '這次治療轉介書內的病情是否屬於工傷 (3個月內)？', explanation: '今次轉介信上面講嘅病，係咪屬於三個月之內發生嘅工傷？',
      options: [
        { label: '是', emoji: '✔️', val: 1, color: 'clr-red' },
        { label: '否', emoji: '❌', val: 0, color: 'clr-blue' }
      ]
    },
    {
      id: 6, text: '現在是否因這個轉介書內的病情而放病假？', explanation: '你依家係咪因為今次呢個病而放緊病假？',
      options: [
        { label: '有', emoji: '✔️', val: 1, color: 'clr-red' },
        { label: '沒有', emoji: '❌', val: 0, color: 'clr-blue' }
      ]
    },
    {
      id: 7, text: '你的病情是否因嚴重意外受傷引起 (3個月內)？', explanation: '你今次嘅病，係咪因為三個月內發生嘅嚴重意外引起？例如骨折或者交通意外。',
      options: [
        { label: '有', emoji: '✔️', val: 1, color: 'clr-red' },
        { label: '沒有', emoji: '❌', val: 0, color: 'clr-blue' }
      ]
    },
    {
      id: 8, text: '這個轉介書內的病情持續了多久？', explanation: '轉介信上面講嘅呢個病，已經痛咗或者維持咗幾耐？',
      options: [
        { label: '多過3個月', emoji: '🕒', val: 1, color: 'clr-blue' },
        { label: '多過6個星期', emoji: '🕓', val: 2, color: 'clr-yellow' },
        { label: '少過6個星期', emoji: '🕔', val: 3, color: 'clr-red' }
      ]
    },
    {
      id: 9, text: '整體來說，你的病情在最近四星期內之進展情況是：', explanation: '整體嚟講，你覺得最近呢四個星期，你嘅病情係好轉咗，無變，定係差咗？',
      options: [
        { label: '好轉', emoji: '📈', val: 1, color: 'clr-blue' },
        { label: '沒有改變', emoji: '➖', val: 2, color: 'clr-yellow' },
        { label: '惡化', emoji: '📉', val: 3, color: 'clr-red' }
      ]
    },
    {
      id: 10, text: '這個轉介書內的病情/問題，對你應付工作/學業/家務等的能力有多大影響？', explanation: '今次呢個病，對你平時返工、返學或者做家務嘅能力，影響有幾大？',
      options: [
        { label: '沒有影響', emoji: '🟢', val: 1, color: 'clr-blue' },
        { label: '輕度影響', emoji: '🟡', val: 2, color: 'clr-green' },
        { label: '頗大影響，勉強完成', emoji: '🟠', val: 3, color: 'clr-orange' },
        { label: '不能完成所需要求', emoji: '🔴', val: 4, color: 'clr-red' }
      ]
    },
    {
      id: 11, text: '根據你今天的情況，你的痛楚/麻痺/僵硬/乏力等病徵的嚴重程度是：', explanation: '根據你今日嘅感覺，你覺得痛楚或者麻痺嘅嚴重程度係點？',
      options: [
        { label: '沒有問題', emoji: '🟢', val: 1, color: 'clr-blue' },
        { label: '輕微 / 一般', emoji: '🟡', val: 2, color: 'clr-green' },
        { label: '嚴重', emoji: '🟠', val: 3, color: 'clr-orange' },
        { label: '極嚴重', emoji: '🔴', val: 4, color: 'clr-red' }
      ]
    }
  ];

  var totalQuestions = 11;

  /* ═══════════════════ STATE ═══════════════════ */
  var currentIndex   = 0;
  var answers        = [];
  var locked         = false;
  var speechEnabled  = false;
  var speechOK       = ('speechSynthesis' in window);
  var repeatTimer    = null;
  var speechSeqId    = 0;
  var explanationOpen= false;
  var expLoopId      = 0;
  var expLoopTimer   = null;

  /* ═══════════════════ DOM REFS ═══════════════════ */
  var elOverlay      = document.getElementById('speech-overlay');
  var elBanner       = document.getElementById('no-speech-banner');
  var elIntro        = document.getElementById('intro-screen');
  var elStartBtn     = document.getElementById('start-btn');
  var elProgressTxt  = document.getElementById('progress-text');
  var elProgressBar  = document.getElementById('progress-bar-fill');
  var elQNum         = document.getElementById('question-number');
  var elQText        = document.getElementById('question-text');
  var elPrevBtn      = document.getElementById('prev-btn');
  var elReplay       = document.getElementById('replay-btn');
  var elExplainBtn   = document.getElementById('explain-btn');
  var elExplainPanel = document.getElementById('explanation-panel');
  var elExplainText  = document.getElementById('explain-text');
  var elExplainListen= document.getElementById('explain-listen-btn');
  var elAnswers      = document.getElementById('answers-area');
  var elQuiz         = document.getElementById('quiz-area');
  var elResult       = document.getElementById('result-screen');
  var elResultScore  = document.getElementById('result-scores');
  var elRestart      = document.getElementById('restart-btn');

  /* ═══════════════════════════════════════════════════
     CANTONESE VOICE SELECTION
     ═══════════════════════════════════════════════════ */
  function applyVoice(utter){
    var voices = window.speechSynthesis.getVoices();
    var cantoneseVoice = null;
    for(var i = 0; i < voices.length; i++){
      var v = voices[i];
      var lang = (v.lang || '').toLowerCase();
      var name = (v.name || '').toLowerCase();
      if(lang === 'zh-hk' || lang.indexOf('yue') !== -1 || name.indexOf('cantonese') !== -1 || name.indexOf('粵語') !== -1){
        cantoneseVoice = v;
        break;
      }
    }
    if(!cantoneseVoice){
      for(var i = 0; i < voices.length; i++){
        var v = voices[i];
        var lang = (v.lang || '').toLowerCase();
        var name = (v.name || '').toLowerCase();
        if(lang.indexOf('zh-cn') !== -1 || name.indexOf('mandarin') !== -1 || name.indexOf('普通话') !== -1 || name.indexOf('國語') !== -1) continue;
        if(lang.indexOf('zh') === 0){ cantoneseVoice = v; break; }
      }
    }
    if(cantoneseVoice){ utter.voice = cantoneseVoice; utter.lang = cantoneseVoice.lang; } 
    else { utter.lang = 'zh-HK'; }
    utter.rate = 0.8;
  }

  /* ═══════════════════ HELPERS ═══════════════════ */
  function clearAllGlow(){
    var btns = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < btns.length; i++) btns[i].classList.remove('glow');
  }

  function startRepeatTimer(){
    stopRepeatTimer();
    repeatTimer = setTimeout(function(){
      if(!locked && !explanationOpen && elQuiz.style.display !== 'none'){ speakSequence(); }
    }, 10000);
  }

  function stopRepeatTimer(){
    if(repeatTimer !== null){ clearTimeout(repeatTimer); repeatTimer = null; }
  }

  /* ═══════════════════ EXPLANATION LOOP ═══════════════════ */
  function stopExpLoop(){
    expLoopId++;
    if(expLoopTimer !== null){ clearTimeout(expLoopTimer); expLoopTimer = null; }
  }

  function expLoopSpeak(text, myId, cb){
    if(myId !== expLoopId) return;
    if(!speechOK || !speechEnabled){ if(cb) cb(); return; }
    var utter = new SpeechSynthesisUtterance(text);
    applyVoice(utter);
    utter.onend = function(){ if(myId === expLoopId && cb) cb(); };
    utter.onerror = function(){ if(myId === expLoopId && cb) cb(); };
    window.speechSynthesis.speak(utter);
  }

  function startExpLoop(explanationText){
    stopExpLoop();
    stopRepeatTimer();
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    speechSeqId++;

    var myId = expLoopId;
    var qText = questions[currentIndex].text;

    expLoopSpeak(explanationText, myId, function(){
      if(myId !== expLoopId) return;
      expLoopTimer = setTimeout(function(){
        if(myId !== expLoopId) return;
        expLoopRepeatCycle(myId, qText, explanationText);
      }, 10000);
    });
  }

  function expLoopRepeatCycle(myId, qText, eText){
    if(myId !== expLoopId) return;
    expLoopSpeak(qText, myId, function(){
      if(myId !== expLoopId) return;
      expLoopSpeak(eText, myId, function(){
        if(myId !== expLoopId) return;
        expLoopTimer = setTimeout(function(){
          if(myId !== expLoopId) return;
          expLoopRepeatCycle(myId, qText, eText);
        }, 10000);
      });
    });
  }

  /* ═══════════════════ SPEECH: SEQUENCE ═══════════════════ */
  function speakSequence(){
    if(!speechOK || !speechEnabled) return;
    window.speechSynthesis.cancel();
    clearAllGlow();
    stopRepeatTimer();

    speechSeqId++;
    var mySeqId = speechSeqId;
    var q = questions[currentIndex];
    var items = [{ text: q.text, buttonIndex: -1 }];

    var btns = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < btns.length; i++){
      items.push({ text: btns[i].getAttribute('data-speech'), buttonIndex: i });
    }

    var idx = 0;
    function speakNext(){
      if(mySeqId !== speechSeqId) return;
      if(idx >= items.length || locked){
        clearAllGlow();
        if(mySeqId === speechSeqId) startRepeatTimer();
        return;
      }

      var item = items[idx];
      var utter = new SpeechSynthesisUtterance(item.text);
      applyVoice(utter);

      utter.onstart = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        if(item.buttonIndex >= 0){
          var allBtns = elAnswers.querySelectorAll('.answer-btn');
          if(allBtns[item.buttonIndex]) allBtns[item.buttonIndex].classList.add('glow');
        }
      };
      utter.onend = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        idx++;
        setTimeout(speakNext, 400);
      };
      utter.onerror = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        idx++;
        setTimeout(speakNext, 400);
      };
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  }

  /* ═══════════════════ EXPLANATION (QUESTION) ═══════════════════ */
  function openExplanation(){
    explanationOpen = true;
    elExplainPanel.style.display = 'block';
    elExplainBtn.classList.add('active');
    startExpLoop(questions[currentIndex].explanation);
  }

  function closeExplanation(){
    explanationOpen = false;
    elExplainPanel.style.display = 'none';
    elExplainBtn.classList.remove('active');
  }

  function toggleExplanation(){
    if(explanationOpen){
      closeExplanation();
      stopExpLoop();
      if(speechOK) window.speechSynthesis.cancel();
      speechSeqId++;
      startRepeatTimer();
    } else {
      openExplanation();
    }
  }

  /* ═══════════════════ RENDER ═══════════════════ */
  function renderQuestion(){
    locked = false;
    explanationOpen = false;
    stopExpLoop();
    var q = questions[currentIndex];

    elProgressTxt.textContent = '第 ' + (currentIndex + 1) + ' / ' + totalQuestions + ' 題';
    elProgressBar.style.width = ((currentIndex + 1) / totalQuestions * 100) + '%';
    elQNum.textContent = '問題 ' + (currentIndex + 1);
    elQText.textContent = q.text;

    if(currentIndex > 0) elPrevBtn.style.display = 'inline-flex';
    else elPrevBtn.style.display = 'none';

    elExplainPanel.style.display = 'none';
    elExplainBtn.classList.remove('active');
    elExplainText.textContent = '（' + q.explanation + '）';

    elAnswers.innerHTML = '';

    // Dynamic button generation from JSON options
    for(var i=0; i<q.options.length; i++) {
        var opt = q.options[i];
        var isSelected = (answers[currentIndex] === opt.val);
        addButton(opt.emoji, opt.label, opt.val, opt.color, isSelected);
    }

    window.scrollTo(0, 0);
    speakSequence();
  }

  function addButton(emoji, label, value, colorClass, isSelected){
    var btn = document.createElement('button');
    btn.className = 'answer-btn ' + colorClass;
    if(isSelected) btn.classList.add('selected');
    
    if(emoji){
      var es = document.createElement('span');
      es.className = 'btn-emoji';
      es.textContent = emoji;
      btn.appendChild(es);
    }
    var ts = document.createElement('span');
    ts.textContent = label;
    btn.appendChild(ts);
    
    btn.setAttribute('data-speech', label);
    btn.addEventListener('click', function(){ onAnswer(btn, value); });
    elAnswers.appendChild(btn);
  }

  /* ═══════════════════ ANSWER ═══════════════════ */
  function onAnswer(btn, value){
    if(locked) return;
    locked = true;

    stopRepeatTimer();
    stopExpLoop();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    closeExplanation();

    var all = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < all.length; i++) all[i].classList.add('locked');
    btn.classList.remove('locked');
    btn.classList.add('selected');

    answers[currentIndex] = value;

    setTimeout(function(){
      currentIndex++;
      if(currentIndex < questions.length) renderQuestion();
      else showResult();
    }, 350);
  }

  function prevQuestion(){
    if(currentIndex <= 0) return;
    stopRepeatTimer();
    stopExpLoop();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    closeExplanation();
    currentIndex--;
    renderQuestion();
  }

  /* ═══════════════════ RESULT & SCORING LOGIC ═══════════════════ */
  function showResult(){
    stopRepeatTimer();
    stopExpLoop();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();

    elQuiz.style.display = 'none';
    elResult.style.display = 'block';

    // Retrieve variables for logic rules
    var ans1 = answers[0]; // Time preference
    var ans2 = answers[1]; // Implants
    
    // Q3 to Q7 check (value 1 represents "Yes/有")
    var q3_yes = (answers[2] === 1);
    var q4_7_yes = (answers[3] === 1 || answers[4] === 1 || answers[5] === 1 || answers[6] === 1);
    
    // Q8-Q11 Score
    var score8_11 = answers[7] + answers[8] + answers[9] + answers[10];

    // Priority Check Structure
    var triage = "R (例行)";
    var isP1 = false;
    var isP2 = false;
    var isR = false;

    // Rule 1: Any tick in Q4-7 -> P1
    if(q4_7_yes) isP1 = true;
    
    // Rule 2: Q3 ticked -> R
    if(q3_yes) isR = true;
    
    // Rule 3: Q8-11 score == 14 -> P1
    if(score8_11 === 14) isP1 = true;
    
    // Rule 4: Q8-11 score 11 to 13 -> P2 (Since 14 is P1)
    if(score8_11 >= 11 && score8_11 <= 13) isP2 = true;
    
    // Rule 5: Q8-11 score <= 10 -> R
    if(score8_11 <= 10) isR = true;

    // Apply strict hierarchy: P1 overrides P2, P2 overrides R.
    if(isP1) triage = "P1 (第一優先)";
    else if(isP2) triage = "P2 (第二優先)";
    else triage = "R (例行)";

    // Format Result HTML String
    var resHTML = "<div style='font-size:1.4rem; padding:10px;'>";
    resHTML += "<strong>1. 物理治療時間：</strong> <span style='color:#1368ce'>" + ans1 + "</span><br><br>";
    resHTML += "<strong>2. 植入電子儀器：</strong> <span style='color:#1368ce'>" + ans2 + "</span><br>";
    resHTML += "<hr style='margin:1.5rem 0; opacity:0.3'>";
    resHTML += "<strong>第 8-11 題 總分：</strong> <span style='font-size:2.2rem; color:#e21b3c;'>" + score8_11 + "</span><span style='font-size:1.3rem'> / 14</span><br><br>";
    
    // Color code triage output
    var triageColor = "#17b978";
    if (triage.includes("P1")) triageColor = "#e21b3c";
    else if (triage.includes("P2")) triageColor = "#e67e22";

    resHTML += "<strong>分流結果 (Triage)：</strong><br><span style='font-size:2.5rem; color:" + triageColor + ";'>" + triage + "</span>";
    resHTML += "</div>";

    elResultScore.innerHTML = resHTML;
    window.scrollTo(0, 0);

    // Speak ending
    var utter = new SpeechSynthesisUtterance("非常感謝您完成了這份調查。請將結果交回物理治療部接待處。");
    applyVoice(utter);
    if(speechOK && speechEnabled) window.speechSynthesis.speak(utter);
  }

  /* ═══════════════════ INIT ═══════════════════ */
  function init(){
    if(!speechOK){
      elOverlay.style.display = 'none';
      elBanner.style.display = 'block';
      elIntro.style.display = 'flex';
    } else {
      window.speechSynthesis.getVoices();
      if(typeof window.speechSynthesis.onvoiceschanged !== 'undefined'){
        window.speechSynthesis.onvoiceschanged = function(){
          window.speechSynthesis.getVoices();
        };
      }
      elOverlay.addEventListener('click', onOverlayTap);
    }

    elStartBtn.addEventListener('click', function(){
      if(speechOK && speechEnabled){
        window.speechSynthesis.cancel();
      }
      elIntro.style.display = 'none';
      startQuiz();
    });

    elPrevBtn.addEventListener('click', prevQuestion);
    elReplay.addEventListener('click', function(){
      closeExplanation();
      stopExpLoop();
      stopRepeatTimer();
      speakSequence();
    });
    elExplainBtn.addEventListener('click', function(){
      toggleExplanation();
    });
    elExplainListen.addEventListener('click', function(){
      var q = questions[currentIndex];
      startExpLoop(q.explanation);
    });
    elRestart.addEventListener('click', function(){
      stopRepeatTimer();
      stopExpLoop();
      speechSeqId++;
      if(speechOK) window.speechSynthesis.cancel();
      clearAllGlow();
      elResult.style.display = 'none';
      elIntro.style.display = 'flex';
      window.scrollTo(0,0);
    });
  }

  function onOverlayTap(){
    speechEnabled = true;
    elOverlay.style.display = 'none';
    var dummy = new SpeechSynthesisUtterance('');
    dummy.lang = 'zh-HK';
    dummy.volume = 0;
    window.speechSynthesis.speak(dummy);
    elIntro.style.display = 'flex';
  }

  function startQuiz(){
    currentIndex = 0;
    answers = [];
    elResult.style.display = 'none';
    elQuiz.style.display = 'flex';
    renderQuestion();
  }

  init();
})();
</script>
</body>
</html>
